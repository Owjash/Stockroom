server:
  address: 127.0.0.1
  port: 8080
  error:
    include-message: never
spring:
  datasource:
    url: jdbc:h2:file:./data/inventory;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ''
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  ai:
    model:
      chat: none
      embedding: none
app:
  retrieval-engine: memory
  ai-enabled: false
  embedding-model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}
---
spring:
  config:
    activate:
      on-profile: ai
  ai:
    model:
      chat: ollama
      embedding: ollama
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:qwen2.5:3b}
          temperature: 0.0
          num-predict: 700
      embedding:
        options:
          model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}
app:
  ai-enabled: true
---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/smart_inventory}
    username: ${DATABASE_USER:assistant}
    password: ${DATABASE_PASSWORD:local-dev-only}
app:
  retrieval-engine: pgvector
